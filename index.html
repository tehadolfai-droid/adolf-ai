<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ADOLF.AI</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, push, set, get, remove }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC51-cDkbkOoxRqIqdzq2OXEJvmQK2c4S8",
      authDomain: "adolf-ai.firebaseapp.com",
      databaseURL: "https://adolf-ai-default-rtdb.firebaseio.com",
      projectId: "adolf-ai",
      storageBucket: "adolf-ai.firebasestorage.app",
      messagingSenderId: "551119559853",
      appId: "1:551119559853:web:706f54d93518930c3a3a24"
    };

    const WORKER_URL = 'https://calm-surf-c776adolfai.tehadolfai.workers.dev';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let chats = {};
    let currentChatId = null;
    let sidebarOpen = false;

    const now = new Date();
    const currentDate = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        await loadAllChats();
        showApp();
      } else {
        currentUser = null;
        showAuth();
      }
    });

    window.toggleSidebar = function() {
      sidebarOpen = !sidebarOpen;
      document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
      document.getElementById('overlay').classList.toggle('show', sidebarOpen);
    }

    window.closeSidebar = function() {
      sidebarOpen = false;
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    }

    window.signup = async function() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const pass = document.getElementById('signupPassword').value;
      if (!name || !email || !pass) return showError('Please fill all fields.');
      if (pass.length < 6) return showError('Password must be at least 6 characters.');
      try {
        showError('Creating account...');
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        await set(ref(db, 'users/' + cred.user.uid), { name, email, createdAt: Date.now() });
      } catch (e) {
        showError(e.message.replace('Firebase: ', '').replace(/\(auth.*\)/, '').trim());
      }
    }

    window.login = async function() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;
      if (!email || !pass) return showError('Please fill all fields.');
      try {
        showError('Signing in...');
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) { showError('Invalid email or password.'); }
    }

    window.logout = async function() {
      await signOut(auth);
      chats = {}; currentChatId = null; closeSidebar();
    }

    async function loadAllChats() {
      chats = {};
      const snap = await get(ref(db, 'chats/' + currentUser.uid));
      if (snap.exists()) {
        const data = snap.val();
        Object.keys(data).forEach(chatId => {
          const chat = data[chatId];
          chats[chatId] = { title: chat.title || 'New Chat', createdAt: chat.createdAt || 0, messages: [] };
          if (chat.messages) {
            chats[chatId].messages = Object.values(chat.messages).sort((a, b) => a.createdAt - b.createdAt);
          }
        });
      }
    }

    window.newChat = async function() {
      const chatRef = push(ref(db, 'chats/' + currentUser.uid));
      const chatId = chatRef.key;
      await set(chatRef, { title: 'New Chat', createdAt: Date.now() });
      chats[chatId] = { title: 'New Chat', messages: [], createdAt: Date.now() };
      currentChatId = chatId;
      renderHistory(); renderMessages();
      document.getElementById('chatTitle').textContent = 'New Chat';
      closeSidebar();
      document.getElementById('chatInput').focus();
    }

    window.loadChat = function(id) {
      currentChatId = id;
      renderHistory(); renderMessages();
      document.getElementById('chatTitle').textContent = chats[id].title;
      closeSidebar();
    }

    window.deleteChat = async function(id, e) {
      e.stopPropagation();
      await remove(ref(db, 'chats/' + currentUser.uid + '/' + id));
      delete chats[id];
      const ids = Object.keys(chats);
      if (currentChatId === id) { if (ids.length > 0) loadChat(ids[0]); else newChat(); }
      else renderHistory();
    }

    async function saveMessage(chatId, role, content) {
      const msgRef = push(ref(db, 'chats/' + currentUser.uid + '/' + chatId + '/messages'));
      await set(msgRef, { role, content, createdAt: Date.now() });
    }

    async function updateChatTitle(chatId, title) {
      await set(ref(db, 'chats/' + currentUser.uid + '/' + chatId + '/title'), title);
    }

    async function searchWeb(query) {
      try {
        const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
        const data = await res.json();
        let results = '';
        if (data.AbstractText) results += data.AbstractText + '\n';
        if (data.RelatedTopics) {
          data.RelatedTopics.slice(0, 4).forEach(t => { if (t.Text) results += '- ' + t.Text + '\n'; });
        }
        return results || null;
      } catch { return null; }
    }

    function needsSearch(text) {
      const kw = ['latest', 'current', 'today', 'news', 'now', 'recent', 'price', 'weather', 'who is', 'what is', 'when is', 'score', 'live', '2024', '2025', '2026', 'search', 'find online'];
      return kw.some(k => text.toLowerCase().includes(k));
    }

    window.sendMessage = async function() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      const chat = chats[currentChatId];
      chat.messages.push({ role: 'user', content: text, createdAt: Date.now() });
      appendMessageDOM('user', text);
      input.value = ''; input.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;

      if (chat.messages.length === 1) {
        const title = text.slice(0, 36) + (text.length > 36 ? '...' : '');
        chat.title = title;
        document.getElementById('chatTitle').textContent = title;
        await updateChatTitle(currentChatId, title);
        renderHistory();
      }

      await saveMessage(currentChatId, 'user', text);
      showTyping();

      let searchContext = '';
      if (needsSearch(text)) {
        updateTyping('🔍 Searching the web...');
        const results = await searchWeb(text);
        if (results) searchContext = `\n\nWeb search results for context:\n${results}`;
        updateTyping(null);
      }

      const systemPrompt = `You are ADOLF.AI, a smart, accurate and helpful AI assistant. Today's date is ${currentDate}. You are fully up to date. You can write code, explain concepts, research, write essays, do math and more. Use **bold** for important terms. Keep responses clear and useful. Never claim you don't know the current date — it is ${currentDate}.${searchContext ? '\n\nYou have web search results available. Use them to answer accurately:' + searchContext : ''}`;

      const apiMessages = [
        { role: 'system', content: systemPrompt },
        ...chat.messages.map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.content }))
      ];

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: apiMessages })
        });
        const data = await res.json();
        const reply = data.reply || 'Sorry, something went wrong.';
        removeTyping();
        chat.messages.push({ role: 'ai', content: reply, createdAt: Date.now() });
        appendMessageDOM('ai', reply);
        await saveMessage(currentChatId, 'ai', reply);
      } catch (err) {
        removeTyping();
        const errMsg = 'Network error. Please check your connection.';
        chat.messages.push({ role: 'ai', content: errMsg, createdAt: Date.now() });
        appendMessageDOM('ai', errMsg);
        await saveMessage(currentChatId, 'ai', errMsg);
      }
      document.getElementById('sendBtn').disabled = false;
    }

    function showApp() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'flex';
      const name = currentUser.displayName || currentUser.email.split('@')[0];
      document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
      document.getElementById('userNameDisplay').textContent = name;
      document.getElementById('userEmailDisplay').textContent = currentUser.email;
      renderHistory();
      const ids = Object.keys(chats).sort((a,b) => (chats[b].createdAt||0)-(chats[a].createdAt||0));
      if (ids.length === 0) newChat();
      else { currentChatId = ids[0]; renderMessages(); document.getElementById('chatTitle').textContent = chats[ids[0]].title; }
    }

    function showAuth() {
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('appScreen').style.display = 'none';
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      const sorted = Object.keys(chats).sort((a, b) => (chats[b].createdAt||0)-(chats[a].createdAt||0));
      if (sorted.length === 0) { list.innerHTML = '<div class="no-chats">No chats yet</div>'; return; }
      sorted.forEach(id => {
        const item = document.createElement('div');
        item.className = 'history-item' + (id === currentChatId ? ' active' : '');
        item.innerHTML = `<span class="hist-title">${chats[id].title}</span><button class="del-btn" onclick="deleteChat('${id}', event)">✕</button>`;
        item.addEventListener('click', () => loadChat(id));
        list.appendChild(item);
      });
    }

    function renderMessages() {
      const div = document.getElementById('messagesDiv');
      div.innerHTML = '';
      const chat = chats[currentChatId];
      if (!chat || chat.messages.length === 0) { div.innerHTML = welcomeHTML(); return; }
      chat.messages.forEach(m => appendMessageDOM(m.role, m.content));
      div.scrollTop = div.scrollHeight;
    }

    function welcomeHTML() {
      const name = (currentUser.displayName || currentUser.email).split(' ')[0];
      return `<div class="welcome">
        <div class="w-logo">ADOLF.AI</div>
        <div class="w-greet">Hello, ${name} 👋</div>
        <p class="w-sub">I can code, write, research, explain and search the web for you.</p>
        <div class="chips">
          <div class="chip" onclick="useChip(this)">💻 Build a to-do app in HTML</div>
          <div class="chip" onclick="useChip(this)">🔍 What is the latest AI news today</div>
          <div class="chip" onclick="useChip(this)">📝 Write a professional email</div>
          <div class="chip" onclick="useChip(this)">🐍 Explain Python for beginners</div>
        </div>
      </div>`;
    }

    function appendMessageDOM(role, content) {
      const div = document.getElementById('messagesDiv');
      const welcome = div.querySelector('.welcome');
      if (welcome) welcome.remove();
      const name = currentUser.displayName || currentUser.email;
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      const av = role === 'user'
        ? `<div class="msg-av uav">${name.charAt(0).toUpperCase()}</div>`
        : `<div class="msg-av aav">A</div>`;
      msg.innerHTML = `${av}<div class="bubble"><div class="content">${formatText(content)}</div></div>`;
      div.appendChild(msg);
      div.scrollTop = div.scrollHeight;
    }

    function formatText(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
        .replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/\n/g,'<br>');
    }

    function showTyping() {
      const div = document.getElementById('messagesDiv');
      const t = document.createElement('div');
      t.className = 'msg ai'; t.id = 'typingEl';
      t.innerHTML = `<div class="msg-av aav">A</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
      div.appendChild(t); div.scrollTop = div.scrollHeight;
    }

    function updateTyping(msg) {
      const t = document.getElementById('typingEl');
      if (!t) return;
      if (msg) t.querySelector('.bubble').innerHTML = `<div class="searching">${msg}</div>`;
      else t.querySelector('.bubble').innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    }

    function removeTyping() { const t = document.getElementById('typingEl'); if (t) t.remove(); }

    window.useChip = function(el) {
      document.getElementById('chatInput').value = el.textContent.replace(/^.{2}\s/, '');
      sendMessage();
    }

    window.showError = function(msg) { document.getElementById('authError').textContent = msg; }

    window.switchTab = function(tab) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='signup'&&i===1)));
      document.getElementById('loginForm').style.display = tab==='login'?'block':'none';
      document.getElementById('signupForm').style.display = tab==='signup'?'block':'none';
      document.getElementById('authError').textContent = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const inp = document.getElementById('chatInput');
      inp.addEventListener('input', function() { this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,160)+'px'; });
      inp.addEventListener('keydown', function(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });
    });
  </script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0a0f;--surface:#13131a;--s2:#1c1c26;--border:#252535;--accent:#6ee7b7;--accent2:#818cf8;--text:#e8e8f0;--muted:#52526a;--danger:#f87171}
    body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden}

    #loadingScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:999}
    .load-logo{font-size:2.5rem;font-weight:800;letter-spacing:4px;color:var(--accent);animation:pulse 1.5s infinite}
    .load-sub{font-size:0.75rem;color:var(--muted);letter-spacing:3px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

    #authScreen{display:none;align-items:center;justify-content:center;height:100vh;background:radial-gradient(ellipse at top,#0d1a2a 0%,var(--bg) 60%)}
    .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:400px}
    .auth-brand{text-align:center;margin-bottom:28px}
    .auth-brand .name{font-size:1.8rem;font-weight:800;letter-spacing:3px;color:var(--accent)}
    .auth-brand .tag{font-size:0.68rem;color:var(--muted);letter-spacing:3px;margin-top:4px}
    .tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:22px}
    .tab{flex:1;padding:9px;text-align:center;font-family:'Syne',sans-serif;font-weight:700;font-size:0.83rem;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:8px;transition:all 0.2s}
    .tab.active{background:var(--s2);color:var(--text)}
    .field{margin-bottom:13px}
    .field label{display:block;font-size:0.7rem;color:var(--muted);margin-bottom:5px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
    .field input{width:100%;padding:10px 13px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'Syne',sans-serif;font-size:0.88rem;outline:none;transition:border 0.2s}
    .field input:focus{border-color:var(--accent)}
    .auth-btn{width:100%;padding:11px;background:var(--accent);border:none;border-radius:9px;font-family:'Syne',sans-serif;font-weight:800;font-size:0.9rem;color:var(--bg);cursor:pointer;margin-top:4px;transition:opacity 0.2s}
    .auth-btn:hover{opacity:0.88}
    .auth-error{font-size:0.78rem;color:var(--danger);text-align:center;margin-top:10px;min-height:16px}

    #appScreen{display:none;height:100vh;height:100dvh;position:relative;flex-direction:column}
    #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:40;backdrop-filter:blur(2px)}
    #overlay.show{display:block}

    #sidebar{position:fixed;top:0;left:0;height:100vh;height:100dvh;width:275px;background:var(--surface);border-right:1px solid var(--border);z-index:50;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1)}
    #sidebar.open{transform:translateX(0)}
    .sb-top{padding:18px 14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .sb-brand{font-size:1.1rem;font-weight:800;letter-spacing:2px;color:var(--accent)}
    .sb-close{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 8px;border-radius:6px}
    .sb-close:hover{color:var(--text);background:var(--s2)}
    .new-btn{margin:10px;padding:10px 13px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'Syne',sans-serif;font-weight:700;font-size:0.83rem;cursor:pointer;display:flex;align-items:center;gap:8px;transition:border-color 0.2s}
    .new-btn:hover{border-color:var(--accent);color:var(--accent)}
    .hl{padding:7px 14px 3px;font-size:0.63rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-weight:700}
    #historyList{flex:1;overflow-y:auto;overflow-x:hidden;padding:3px 7px;min-height:0}
    .history-item{padding:8px 9px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background 0.15s}
    .history-item:hover{background:var(--s2)}
    .history-item.active{background:var(--s2);border-left:2px solid var(--accent)}
    .hist-title{font-size:0.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .history-item.active .hist-title{color:var(--text)}
    .del-btn{background:none;border:none;color:transparent;cursor:pointer;font-size:0.68rem;padding:2px 5px;border-radius:4px}
    .history-item:hover .del-btn{color:var(--muted)}
    .del-btn:hover{color:var(--danger)!important;background:rgba(248,113,113,0.1)}
    .no-chats{padding:14px;font-size:0.78rem;color:var(--muted);text-align:center}
    .sb-user{border-top:1px solid var(--border);padding:11px;display:flex;align-items:center;gap:9px}
    .s-av{width:30px;height:30px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.82rem;color:white;flex-shrink:0}
    .s-info{flex:1;overflow:hidden}
    .s-name{font-size:0.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .s-email{font-size:0.66rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lo-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:4px 6px;border-radius:6px}
    .lo-btn:hover{color:var(--danger)}

    .topbar{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;background:var(--surface);flex-shrink:0}
    .menu-btn{background:none;border:1px solid var(--border);color:var(--text);cursor:pointer;padding:6px 9px;border-radius:7px;font-size:1rem;transition:border-color 0.2s;line-height:1}
    .menu-btn:hover{border-color:var(--accent);color:var(--accent)}
    .topbar-title{font-weight:700;font-size:0.92rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .web-badge{font-size:0.65rem;background:rgba(110,231,183,0.1);color:var(--accent);border:1px solid rgba(110,231,183,0.25);padding:3px 8px;border-radius:20px;font-weight:700;letter-spacing:1px;white-space:nowrap}

    .messages{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
    .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;padding:30px 16px;gap:10px}
    .w-logo{font-size:2.2rem;font-weight:800;letter-spacing:4px;color:var(--accent)}
    .w-greet{font-size:1.15rem;font-weight:700}
    .w-sub{font-size:0.85rem;color:var(--muted);max-width:360px;line-height:1.7}
    .chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:6px}
    .chip{padding:7px 13px;border-radius:20px;border:1px solid var(--border);font-size:0.78rem;color:var(--muted);cursor:pointer;font-family:'Syne',sans-serif;transition:all 0.2s}
    .chip:hover{border-color:var(--accent);color:var(--accent)}
    .msg{display:flex;gap:9px;align-items:flex-start;max-width:100%}
    .msg.user{flex-direction:row-reverse}
    .msg-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.78rem;flex-shrink:0}
    .uav{background:var(--accent2);color:white}
    .aav{background:var(--accent);color:var(--bg);font-size:0.82rem}
    .bubble{max-width:calc(100% - 40px)}
    .content{padding:9px 13px;border-radius:11px;font-size:0.88rem;line-height:1.72}
    .msg.user .content{background:var(--accent2);color:white;border-radius:11px 4px 11px 11px}
    .msg.ai .content{background:var(--s2);border:1px solid var(--border);border-radius:4px 11px 11px 11px}
    .msg.ai .content strong{color:var(--accent)}
    .msg.ai .content code{font-family:'JetBrains Mono',monospace;background:var(--bg);padding:2px 5px;border-radius:4px;font-size:0.78rem;color:var(--accent)}
    .typing{display:flex;gap:5px;align-items:center;padding:11px 13px}
    .typing span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite}
    .typing span:nth-child(2){animation-delay:0.2s}
    .typing span:nth-child(3){animation-delay:0.4s}
    @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-5px);opacity:1}}
    .searching{padding:9px 13px;font-size:0.8rem;color:var(--accent);font-style:italic}

    .input-wrap{padding:10px 14px 14px;padding-bottom:max(14px, env(safe-area-inset-bottom));border-top:1px solid var(--border);flex-shrink:0}
    .input-box{display:flex;align-items:flex-end;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:11px;padding:8px 11px;transition:border-color 0.2s}
    .input-box:focus-within{border-color:var(--accent)}
    #chatInput{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:'Syne',sans-serif;font-size:0.88rem;resize:none;min-height:24px;max-height:160px;line-height:1.5}
    #chatInput::placeholder{color:var(--muted)}
    #sendBtn{width:32px;height:32px;border-radius:7px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;transition:opacity 0.2s;color:var(--bg);font-weight:800}
    #sendBtn:hover{opacity:0.85}
    #sendBtn:disabled{opacity:0.3;cursor:not-allowed}
    .hint{font-size:0.65rem;color:var(--muted);text-align:center;margin-top:5px}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  </style>
</head>
<body>

<div id="loadingScreen">
  <div class="load-logo">ADOLF.AI</div>
  <div class="load-sub">INITIALIZING...</div>
</div>

<div id="authScreen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="name">ADOLF.AI</div>
      <div class="tag">INTELLIGENT • POWERFUL • YOURS</div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('signup')">Sign Up</button>
    </div>
    <div id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••"/></div>
      <button class="auth-btn" onclick="login()">Sign In</button>
    </div>
    <div id="signupForm" style="display:none">
      <div class="field"><label>Full Name</label><input type="text" id="signupName" placeholder="Your name"/></div>
      <div class="field"><label>Email</label><input type="email" id="signupEmail" placeholder="you@example.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="signupPassword" placeholder="Min 6 characters"/></div>
      <button class="auth-btn" onclick="signup()">Create Account</button>
    </div>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<div id="appScreen">
  <div id="overlay" onclick="closeSidebar()"></div>

  <div id="sidebar">
    <div class="sb-top">
      <div class="sb-brand">ADOLF.AI</div>
      <button class="sb-close" onclick="closeSidebar()">✕</button>
    </div>
    <button class="new-btn" onclick="newChat()">✏️ New Chat</button>
    <div class="hl">Chat History</div>
    <div id="historyList"></div>
    <div class="sb-user">
      <div class="s-av" id="userAvatar">?</div>
      <div class="s-info">
        <div class="s-name" id="userNameDisplay">User</div>
        <div class="s-email" id="userEmailDisplay"></div>
      </div>
      <button class="lo-btn" onclick="logout()" title="Logout">⏻</button>
    </div>
  </div>

  <div class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="topbar-title" id="chatTitle">ADOLF.AI</div>
    <div class="web-badge">🔍 WEB</div>
  </div>

  <div class="messages" id="messagesDiv"></div>

  <div class="input-wrap">
    <div class="input-box">
      <textarea id="chatInput" rows="1" placeholder="Ask anything or search the web..."></textarea>
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <div class="hint">ADOLF.AI can search the web • Enter to send • Shift+Enter for new line</div>
  </div>
</div>

</body>
</html>
