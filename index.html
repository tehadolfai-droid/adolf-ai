<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ADOLF.AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, push, set, get, remove }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC51-cDkbkOoxRqIqdzq2OXEJvmQK2c4S8",
      authDomain: "adolf-ai.firebaseapp.com",
      databaseURL: "https://adolf-ai-default-rtdb.firebaseio.com",
      projectId: "adolf-ai",
      storageBucket: "adolf-ai.firebasestorage.app",
      messagingSenderId: "551119559853",
      appId: "1:551119559853:web:706f54d93518930c3a3a24"
    };

    // ══════════════════════════════════════════
    // YOUR CLOUDFLARE WORKER URL
    // ══════════════════════════════════════════
    const WORKER_URL = 'https://calm-surf-c776adolfai.tehadolfai.workers.dev';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let chats = {};
    let currentChatId = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        await loadAllChats();
        showApp();
      } else {
        currentUser = null;
        showAuth();
      }
    });

    window.signup = async function() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const pass = document.getElementById('signupPassword').value;
      if (!name || !email || !pass) return showError('Please fill all fields.');
      if (pass.length < 6) return showError('Password must be at least 6 characters.');
      try {
        showError('Creating account...');
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        await set(ref(db, 'users/' + cred.user.uid), { name, email, createdAt: Date.now() });
      } catch (e) {
        showError(e.message.replace('Firebase: ', '').replace(/\(auth.*\)/, '').trim());
      }
    }

    window.login = async function() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;
      if (!email || !pass) return showError('Please fill all fields.');
      try {
        showError('Logging in...');
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        showError('Invalid email or password.');
      }
    }

    window.logout = async function() {
      await signOut(auth);
      chats = {};
      currentChatId = null;
    }

    async function loadAllChats() {
      chats = {};
      const snap = await get(ref(db, 'chats/' + currentUser.uid));
      if (snap.exists()) {
        const data = snap.val();
        Object.keys(data).forEach(chatId => {
          const chat = data[chatId];
          chats[chatId] = {
            title: chat.title || 'New Chat',
            createdAt: chat.createdAt || 0,
            messages: []
          };
          if (chat.messages) {
            chats[chatId].messages = Object.values(chat.messages).sort((a, b) => a.createdAt - b.createdAt);
          }
        });
      }
    }

    window.newChat = async function() {
      const chatRef = push(ref(db, 'chats/' + currentUser.uid));
      const chatId = chatRef.key;
      await set(chatRef, { title: 'New Chat', createdAt: Date.now() });
      chats[chatId] = { title: 'New Chat', messages: [], createdAt: Date.now() };
      currentChatId = chatId;
      renderHistory();
      renderMessages();
      document.getElementById('chatTitle').textContent = 'New Chat';
      document.getElementById('chatInput').focus();
    }

    window.loadChat = function(id) {
      currentChatId = id;
      renderHistory();
      renderMessages();
      document.getElementById('chatTitle').textContent = chats[id].title;
    }

    window.deleteChat = async function(id, e) {
      e.stopPropagation();
      await remove(ref(db, 'chats/' + currentUser.uid + '/' + id));
      delete chats[id];
      const ids = Object.keys(chats);
      if (currentChatId === id) {
        if (ids.length > 0) loadChat(ids[0]);
        else newChat();
      } else renderHistory();
    }

    async function saveMessage(chatId, role, content) {
      const msgRef = push(ref(db, 'chats/' + currentUser.uid + '/' + chatId + '/messages'));
      await set(msgRef, { role, content, createdAt: Date.now() });
    }

    async function updateChatTitle(chatId, title) {
      await set(ref(db, 'chats/' + currentUser.uid + '/' + chatId + '/title'), title);
    }

    window.sendMessage = async function() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      const chat = chats[currentChatId];
      chat.messages.push({ role: 'user', content: text, createdAt: Date.now() });
      appendMessageDOM('user', text);
      input.value = '';
      input.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;

      if (chat.messages.length === 1) {
        const title = text.slice(0, 36) + (text.length > 36 ? '...' : '');
        chat.title = title;
        document.getElementById('chatTitle').textContent = title;
        await updateChatTitle(currentChatId, title);
        renderHistory();
      }

      await saveMessage(currentChatId, 'user', text);
      showTyping();

      // Build messages for Groq (OpenAI format)
      const apiMessages = [
        {
          role: 'system',
          content: 'You are ADOLF.AI, a highly intelligent, friendly and knowledgeable AI assistant. You can answer questions on any topic, summarize research, write, code, explain concepts and more. Use **bold** for key terms. Be warm, accurate and helpful.'
        },
        ...chat.messages.map(m => ({
          role: m.role === 'ai' ? 'assistant' : 'user',
          content: m.content
        }))
      ];

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: apiMessages })
        });

        const data = await res.json();
        const reply = data.reply || 'Sorry, something went wrong.';
        removeTyping();
        chat.messages.push({ role: 'ai', content: reply, createdAt: Date.now() });
        appendMessageDOM('ai', reply);
        await saveMessage(currentChatId, 'ai', reply);

      } catch (err) {
        removeTyping();
        const errMsg = 'Network error. Please check your connection.';
        chat.messages.push({ role: 'ai', content: errMsg, createdAt: Date.now() });
        appendMessageDOM('ai', errMsg);
        await saveMessage(currentChatId, 'ai', errMsg);
      }

      document.getElementById('sendBtn').disabled = false;
    }

    function showApp() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('appScreen').classList.add('visible');
      const name = currentUser.displayName || currentUser.email.split('@')[0];
      document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
      document.getElementById('userNameDisplay').textContent = name;
      document.getElementById('userEmailDisplay').textContent = currentUser.email;
      renderHistory();
      const ids = Object.keys(chats);
      if (ids.length === 0) newChat();
      else { currentChatId = ids[0]; renderMessages(); document.getElementById('chatTitle').textContent = chats[ids[0]].title; }
    }

    function showAuth() {
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('appScreen').classList.remove('visible');
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      const sorted = Object.keys(chats).sort((a, b) => (chats[b].createdAt || 0) - (chats[a].createdAt || 0));
      sorted.forEach(id => {
        const item = document.createElement('div');
        item.className = 'history-item' + (id === currentChatId ? ' active' : '');
        item.innerHTML = `<span>${chats[id].title}</span><button class="del-chat" onclick="deleteChat('${id}', event)">🗑</button>`;
        item.addEventListener('click', () => loadChat(id));
        list.appendChild(item);
      });
    }

    function renderMessages() {
      const div = document.getElementById('messagesDiv');
      div.innerHTML = '';
      const chat = chats[currentChatId];
      if (!chat || chat.messages.length === 0) {
        div.innerHTML = welcomeHTML();
        return;
      }
      chat.messages.forEach(m => appendMessageDOM(m.role, m.content));
      div.scrollTop = div.scrollHeight;
    }

    function welcomeHTML() {
      return `<div class="welcome-screen">
        <div class="big-logo">ADOLF.AI</div>
        <p>Your intelligent AI assistant. Ask me anything — research, writing, coding, explanations and more.</p>
        <div class="suggestion-chips">
          <div class="chip" onclick="useChip(this)">🔬 Explain quantum computing</div>
          <div class="chip" onclick="useChip(this)">📝 Write a short story</div>
          <div class="chip" onclick="useChip(this)">🌍 Latest AI research trends</div>
          <div class="chip" onclick="useChip(this)">💡 How does the internet work?</div>
        </div>
      </div>`;
    }

    function appendMessageDOM(role, content) {
      const div = document.getElementById('messagesDiv');
      const welcome = div.querySelector('.welcome-screen');
      if (welcome) welcome.remove();
      const name = currentUser.displayName || currentUser.email;
      const avatarText = role === 'user' ? name.charAt(0).toUpperCase() : '🤖';
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      msg.innerHTML = `
        <div class="msg-avatar">${avatarText}</div>
        <div class="msg-bubble"><p>${formatText(content)}</p></div>`;
      div.appendChild(msg);
      div.scrollTop = div.scrollHeight;
    }

    function formatText(text) {
      return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\n/g, '</p><p>');
    }

    function showTyping() {
      const div = document.getElementById('messagesDiv');
      const welcome = div.querySelector('.welcome-screen');
      if (welcome) welcome.remove();
      const t = document.createElement('div');
      t.className = 'msg ai'; t.id = 'typingIndicator';
      t.innerHTML = `<div class="msg-avatar">🤖</div><div class="typing-indicator"><span></span><span></span><span></span></div>`;
      div.appendChild(t); div.scrollTop = div.scrollHeight;
    }

    function removeTyping() { const t = document.getElementById('typingIndicator'); if (t) t.remove(); }

    window.useChip = function(el) {
      document.getElementById('chatInput').value = el.textContent.replace(/^[^\w]+/, '').trim();
      sendMessage();
    }

    window.showError = function(msg) { document.getElementById('authError').textContent = msg; }

    window.switchTab = function(tab) {
      document.querySelectorAll('.auth-tab').forEach((t, i) =>
        t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='signup'&&i===1)));
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
      document.getElementById('authError').textContent = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('chatInput').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 160) + 'px';
      });
      document.getElementById('chatInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });
    });

  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1e2130; --border: #2d3148;
      --accent: #a78bfa; --accent2: #7dd3fc; --text: #e2e8f0;
      --muted: #64748b; --danger: #f87171; --sidebar-w: 260px;
    }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow: hidden; }
    #loadingScreen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; z-index: 200; }
    .loading-logo { font-size: 2.5rem; font-weight: 900; background: linear-gradient(135deg, #a78bfa, #7dd3fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 3px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .loading-sub { color: var(--muted); font-size: 0.85rem; }
    #authScreen { display: none; align-items: center; justify-content: center; min-height: 100vh; background-image: radial-gradient(ellipse at 20% 50%, #1a1040 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, #0c1a2e 0%, transparent 60%); }
    .auth-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 420px; box-shadow: 0 0 60px rgba(167,139,250,0.08); }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo .logo-name { font-size: 2rem; font-weight: 900; background: linear-gradient(135deg, #a78bfa, #7dd3fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
    .auth-logo .logo-sub { font-size: 0.8rem; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; }
    .auth-tabs { display: flex; margin-bottom: 24px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .auth-tab { flex: 1; padding: 10px; text-align: center; font-weight: 700; font-size: 0.88rem; cursor: pointer; color: var(--muted); background: transparent; border: none; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
    .auth-tab.active { background: var(--accent); color: #0f1117; }
    .auth-field { margin-bottom: 14px; }
    .auth-field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .auth-field input { width: 100%; padding: 11px 14px; background: #161822; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 0.92rem; outline: none; transition: border 0.2s; }
    .auth-field input:focus { border-color: var(--accent); }
    .auth-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #a78bfa, #7dd3fc); border: none; border-radius: 8px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.95rem; color: #0f1117; cursor: pointer; margin-top: 6px; transition: opacity 0.2s; }
    .auth-btn:hover { opacity: 0.9; }
    .auth-error { color: var(--danger); font-size: 0.82rem; margin-top: 10px; text-align: center; min-height: 18px; }
    #appScreen { display: none; height: 100vh; flex-direction: row; }
    #appScreen.visible { display: flex; }
    .sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; flex-shrink: 0; }
    .sidebar-logo { padding: 20px 18px 14px; border-bottom: 1px solid var(--border); }
    .sidebar-logo .logo-name { font-size: 1.3rem; font-weight: 900; background: linear-gradient(135deg, #a78bfa, #7dd3fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
    .new-chat-btn { margin: 12px; padding: 10px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: border-color 0.2s, background 0.2s; }
    .new-chat-btn:hover { border-color: var(--accent); background: #2d3148; }
    .history-label { padding: 8px 18px 4px; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
    .history-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .history-item { padding: 9px 10px; border-radius: 7px; font-size: 0.85rem; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 6px; transition: background 0.15s, color 0.15s; white-space: nowrap; overflow: hidden; }
    .history-item:hover { background: var(--border); color: var(--text); }
    .history-item.active { background: #2d3148; color: var(--text); }
    .history-item span { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .del-chat { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; padding: 2px 4px; border-radius: 4px; display: none; }
    .history-item:hover .del-chat { display: inline; }
    .del-chat:hover { color: var(--danger); }
    .sidebar-bottom { border-top: 1px solid var(--border); padding: 12px; }
    .user-bar { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 8px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #a78bfa, #7dd3fc); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem; color: #0f1117; flex-shrink: 0; }
    .user-info { flex: 1; overflow: hidden; }
    .user-name { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-email { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logout-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 4px; }
    .logout-btn:hover { color: var(--danger); }
    .chat-area { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .topbar { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .topbar-title { font-weight: 800; font-size: 1rem; }
    .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .welcome-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 40px; }
    .welcome-screen .big-logo { font-size: 3rem; font-weight: 900; background: linear-gradient(135deg, #a78bfa, #7dd3fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 3px; }
    .welcome-screen p { color: var(--muted); font-size: 0.95rem; max-width: 420px; line-height: 1.7; }
    .suggestion-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
    .chip { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 0.82rem; color: var(--muted); cursor: pointer; font-family: 'Nunito', sans-serif; transition: border-color 0.2s, color 0.2s; }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .msg { display: flex; gap: 12px; align-items: flex-start; max-width: 820px; }
    .msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .msg.ai { align-self: flex-start; }
    .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; flex-shrink: 0; }
    .msg.user .msg-avatar { background: linear-gradient(135deg, #a78bfa, #7dd3fc); color: #0f1117; }
    .msg.ai .msg-avatar { background: #2d3148; color: var(--accent); font-size: 1rem; }
    .msg-bubble { padding: 12px 16px; border-radius: 12px; font-size: 0.92rem; line-height: 1.75; max-width: 680px; }
    .msg.user .msg-bubble { background: var(--accent); color: #0f1117; border-radius: 12px 4px 12px 12px; }
    .msg.ai .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 4px 12px 12px 12px; }
    .msg.ai .msg-bubble p { margin-bottom: 8px; }
    .msg.ai .msg-bubble p:last-child { margin-bottom: 0; }
    .msg.ai .msg-bubble strong { color: var(--accent); }
    .msg.ai .msg-bubble code { font-family: 'Fira Code', monospace; background: #161822; padding: 2px 6px; border-radius: 4px; font-size: 0.82rem; color: var(--accent2); }
    .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px 12px 12px 12px; }
    .typing-indicator span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-6px);opacity:1} }
    .input-area { padding: 16px 24px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .input-box { display: flex; align-items: flex-end; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; transition: border-color 0.2s; }
    .input-box:focus-within { border-color: var(--accent); }
    #chatInput { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 0.92rem; resize: none; min-height: 24px; max-height: 160px; line-height: 1.5; }
    #chatInput::placeholder { color: var(--muted); }
    .send-btn { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #a78bfa, #7dd3fc); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1rem; transition: opacity 0.2s; }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-hint { font-size: 0.72rem; color: var(--muted); text-align: center; margin-top: 8px; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  </style>
</head>
<body>

<div id="loadingScreen">
  <div class="loading-logo">ADOLF.AI</div>
  <div class="loading-sub">Loading your workspace...</div>
</div>

<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-name">ADOLF.AI</div>
      <div class="logo-sub">Intelligent • Powerful • Yours</div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
    </div>
    <div id="loginForm">
      <div class="auth-field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com"/></div>
      <div class="auth-field"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••"/></div>
      <button class="auth-btn" onclick="login()">Login</button>
    </div>
    <div id="signupForm" style="display:none">
      <div class="auth-field"><label>Full Name</label><input type="text" id="signupName" placeholder="Your name"/></div>
      <div class="auth-field"><label>Email</label><input type="email" id="signupEmail" placeholder="you@example.com"/></div>
      <div class="auth-field"><label>Password</label><input type="password" id="signupPassword" placeholder="Min 6 characters"/></div>
      <button class="auth-btn" onclick="signup()">Create Account</button>
    </div>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<div id="appScreen">
  <div class="sidebar">
    <div class="sidebar-logo"><div class="logo-name">ADOLF.AI</div></div>
    <button class="new-chat-btn" onclick="newChat()">✏️ <span>New Chat</span></button>
    <div class="history-label">Chat History</div>
    <div class="history-list" id="historyList"></div>
    <div class="sidebar-bottom">
      <div class="user-bar">
        <div class="avatar" id="userAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="userNameDisplay">User</div>
          <div class="user-email" id="userEmailDisplay"></div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Logout">⎋</button>
      </div>
    </div>
  </div>
  <div class="chat-area">
    <div class="topbar">
      <div class="topbar-title" id="chatTitle">ADOLF.AI</div>
    </div>
    <div class="messages" id="messagesDiv"></div>
    <div class="input-area">
      <div class="input-box">
        <textarea id="chatInput" rows="1" placeholder="Ask ADOLF anything..."></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
      <div class="input-hint">ADOLF.AI can make mistakes. Verify important information.</div>
    </div>
  </div>
</div>

</body>
</html>
